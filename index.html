<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>待办清单</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #8b929c;
    --primary: #4f7cff;
    --border: #e6e8eb;
    --danger: #ff5b5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1c1f25;
      --text: #e8eaed;
      --muted: #8b929c;
      --border: #2a2e36;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: background .2s, color .2s;
  }
  .app { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px; /* 防止 iOS 聚焦时缩放 */
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus { border-color: var(--primary); }
  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .15s, transform .1s;
  }
  button:active { transform: scale(.96); }
  #addBtn {
    padding: 0 20px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    border-radius: 10px;
    white-space: nowrap;
  }

  .filter { display: flex; gap: 6px; margin-bottom: 14px; }
  .filter button {
    padding: 6px 14px;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .filter button.active { color: #fff; background: var(--primary); border-color: var(--primary); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    animation: fade .2s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } }

  .check {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    background: transparent;
    display: grid;
    place-items: center;
    transition: background .15s, border-color .15s;
  }
  .check::after {
    content: "";
    width: 5px; height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-1px);
    opacity: 0;
  }
  li.done .check { background: #34c759; border-color: #34c759; }
  li.done .check::after { opacity: 1; }

  .text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    cursor: pointer;
  }
  li.done .text { color: var(--muted); text-decoration: line-through; }

  .del {
    flex-shrink: 0;
    width: 28px; height: 28px;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border-radius: 8px;
  }
  .del:hover { color: var(--danger); background: rgba(255,91,91,.1); }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 18px; font-size: 13px; color: var(--muted);
  }
  .footer button { color: var(--muted); background: none; font-size: 13px; }
  .footer button:hover { color: var(--danger); }

  @media (max-width: 400px) {
    h1 { font-size: 20px; }
    #addBtn { padding: 0 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>待办清单</h1>
  <div class="sub">简单、快速、自动保存</div>

  <form class="input-row" id="form">
    <input type="text" id="input" placeholder="添加一项任务…" autocomplete="off" maxlength="200">
    <button type="submit" id="addBtn">添加</button>
  </form>

  <div class="filter">
    <button data-f="all" class="active">全部</button>
    <button data-f="active">未完成</button>
    <button data-f="done">已完成</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>还没有任务，添加一个吧</div>

  <div class="footer" id="footer" hidden>
    <span id="count"></span>
    <button id="clearBtn">清除已完成</button>
  </div>
</div>

<script>
(function () {
  const KEY = 'todo_list_v1';
  const $list = document.getElementById('list');
  const $input = document.getElementById('input');
  const $form = document.getElementById('form');
  const $empty = document.getElementById('empty');
  const $footer = document.getElementById('footer');
  const $count = document.getElementById('count');
  const $clear = document.getElementById('clearBtn');

  let todos = load();
  let filter = 'all';

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(todos));
    } catch (e) {
      console.warn('本地存储写入失败', e);
    }
  }

  function add(text) {
    todos.unshift({ id: Date.now() + '' + Math.random().toString(36).slice(2, 7), text: text, done: false });
    save();
    render();
  }

  function remove(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    save();
    render();
  }

  function toggle(id) {
    todos.forEach(function (t) {
      if (t.id === id) t.done = !t.done;
    });
    save();
    render();
  }

  function visible() {
    if (filter === 'active') return todos.filter(function (t) { return !t.done; });
    if (filter === 'done') return todos.filter(function (t) { return t.done; });
    return todos;
  }

  function render() {
    const items = visible();
    $list.textContent = '';

    items.forEach(function (t) {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';

      const chk = document.createElement('button');
      chk.className = 'check';
      chk.setAttribute('aria-label', '切换完成状态');
      chk.addEventListener('click', function () { toggle(t.id); });

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = t.text;
      span.addEventListener('click', function () { toggle(t.id); });

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', '删除');
      del.addEventListener('click', function () { remove(t.id); });

      li.append(chk, span, del);
      $list.appendChild(li);
    });

    const left = todos.filter(function (t) { return !t.done; }).length;
    $empty.hidden = todos.length !== 0;
    $footer.hidden = todos.length === 0;
    $count.textContent = left + ' 项未完成 / 共 ' + todos.length + ' 项';
    $clear.hidden = todos.length === left;
  }

  $form.addEventListener('submit', function (e) {
    e.preventDefault();
    const text = $input.value.trim();
    if (!text) return;
    add(text);
    $input.value = '';
    $input.focus();
  });

  document.querySelectorAll('.filter button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      filter = btn.dataset.f;
      document.querySelectorAll('.filter button').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      render();
    });
  });

  $clear.addEventListener('click', function () {
    todos = todos.filter(function (t) { return !t.done; });
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
